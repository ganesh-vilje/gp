[project]
name = "panchayat-complaint-tracker-api"
version = "0.1.0"
description = "Panchayat Complaint Tracker API (FastAPI, JSON only)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.118,<0.120",
  "uvicorn>=0.38,<0.39",
  "uvicorn-worker>=0.4,<0.5",
  "gunicorn>=23.0,<24.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.16,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "argon2-cffi>=25.1,<26.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-cov>=7.0,<8.0",
  "httpx>=0.28,<0.29",
  "playwright>=1.55,<2.0",
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2.0",
  "pip-audit>=2.9,<3.0",
]

[project.scripts]
bootstrap-admin = "app.cli.bootstrap_admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) is expected and idiomatic in pytest test files.
[tool.ruff.lint.per-file-ignores]
# S101 (assert) is idiomatic in pytest. S105/S106 (hardcoded-password
# heuristics) fire on synthetic test-only constants (T-006: a known
# plaintext password used to test login, never a real credential). S603
# (subprocess call) fires on T-006's grep-suite smoke test, which
# deliberately invokes `sys.executable` on a fixed, repo-relative script
# path — not untrusted input.
"tests/**/*.py" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast, no external services (default when unmarked)",
  "integration: needs a real Postgres database",
  "e2e: needs the running API and the exported frontend",
]
